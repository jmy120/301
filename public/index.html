<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SysML Parser</title>
  <style>
    :root{--ink:#18243a;--muted:#68768c;--line:#e5eaf1;--bg:#f5f7fb;--blue:#356ee8;--nav:#14203a}*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--nav);color:#d4dcec;padding:22px 14px;display:flex;flex-direction:column;gap:20px}.brand{font-size:19px;font-weight:700;color:#fff}.brand small{display:block;color:#8fa0c2;font-size:10px;letter-spacing:1.4px;margin-top:4px}.import{display:block;text-align:center;border:1px solid #5379d6;background:#2c5ccd;color:#fff;border-radius:7px;padding:10px;cursor:pointer}.tree-head{color:#8fa0c2;font-size:11px;letter-spacing:1px;margin-bottom:8px}.tree{overflow:auto;max-height:calc(100vh - 175px)}.tree button{width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:7px 8px;border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tree button:hover,.tree button.active{background:#25375c;color:#fff}.tree .indent{padding-left:24px}.main{min-width:0;padding:28px}.top{display:flex;align-items:start;justify-content:space-between;gap:16px;margin-bottom:20px}h1{margin:0;font-size:24px}p{margin:5px 0;color:var(--muted)}.status{padding:7px 11px;background:#eaf8ee;color:#24723b;border-radius:99px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 270px;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 8px #1d31530a}.canvas-card{min-width:0}.card-head{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:650;display:flex;justify-content:space-between;gap:10px}.canvas-wrap{height:570px;overflow:auto;background-image:radial-gradient(#d5dce8 1px,transparent 1px);background-size:16px 16px;padding:22px}.canvas{position:relative;background:#fff;border:1px solid #dce3ed;box-shadow:0 3px 12px #33415519;transform-origin:top left;min-width:820px;min-height:480px}.shape{position:absolute;border:1.5px solid #5374bd;border-radius:3px;background:#f8faff;padding:5px 7px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;font-size:12px;cursor:pointer}.shape:hover,.shape.selected{outline:3px solid #8ab0ff;background:#edf4ff}.shape.edge{border:0;background:transparent;outline:0;overflow:visible}.shape.edge:after{content:"";position:absolute;top:50%;left:0;width:100%;border-top:2px solid #71809a}.shape.frame{border:2px solid #5672a8;background:transparent;align-items:flex-start;justify-content:flex-start;font-weight:bold}.details{padding:17px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--muted);font-size:12px}.stat b{display:block;color:var(--ink);font-size:19px;margin-top:2px}.details h3{font-size:13px;margin:20px 0 8px}.detail-list{margin:0;padding:0;list-style:none}.detail-list li{padding:6px 0;border-bottom:1px solid #eef1f5;word-break:break-all}.label{color:var(--muted);font-size:12px;display:block}.empty{height:100%;display:grid;place-content:center;text-align:center;color:var(--muted);gap:8px}.empty strong{font-size:17px;color:var(--ink)}.diagrams{margin-top:18px}.diagram-list{display:flex;gap:8px;overflow:auto;padding:12px 16px}.diagram-list button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 10px;cursor:pointer;color:var(--ink)}.diagram-list button.active{background:#eaf0ff;border-color:#7294ec;color:#244ea9}@media(max-width:1000px){.app{grid-template-columns:210px 1fr}.grid{grid-template-columns:1fr}.canvas-wrap{height:470px}}@media(max-width:700px){.app{display:block}.sidebar{min-height:0}.tree{max-height:190px}.main{padding:16px}.canvas-wrap{height:400px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar"><div class="brand">ModelScope <small>SYSML XML PARSER</small></div><label class="import">导入 XML<input id="file" type="file" accept=".xml,.xmi" hidden></label><div><div class="tree-head">模型结构</div><div id="tree" class="tree"><p>导入 XML 后显示模型树</p></div></div></aside>
    <main class="main"><div class="top"><div><h1 id="title">SysML 模型解析工作台</h1><p id="subtitle">导入 MagicDraw/M-Design XML，查看结构、关系和图形视图</p></div><span id="status" class="status">等待导入</span></div><div id="workspace" class="empty card"><strong>请选择一个 XML/XMI 文件</strong><span>解析结果将通过本机 3000 端口加载。</span></div></main>
  </div><script type="module" src="/diagram-renderer.js"></script>
</body>
</html>
